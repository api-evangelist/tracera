aid: tracera
name: Tracera
description: Tracera (formerly ESG Flo) is an AI-powered corporate sustainability
  and ESG data platform that automates the collection, verification, auditing, and
  reporting of sustainability data with finance-grade accuracy and traceability.
  The platform extracts audit-ready metrics from raw data across PDFs, spreadsheets,
  and ERP systems for 900+ metrics, supports reporting frameworks including CSRD,
  SEC, GRI, and CDP, and serves Fortune 2000 enterprises across manufacturing, real
  estate, construction, retail, technology, and healthcare (customers include EnerSys,
  La-Z-Boy, Sauder Woodworking, and Putzmeister). Founded in 2022 and based in New
  York, Tracera raised a $12M Series A in April 2025 led by Foundry with Rho Ignition,
  Tola Capital, and Contour Venture Partners ($17.25M total). Enrichment probing
  found no public developer API, developer portal, SDKs, or event surface; the website
  is bot-gated by a SiteGround captcha.
